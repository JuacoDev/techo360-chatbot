name: Techo 360 - Probar RPC de chatbot_requests (E2E workers)

# Manual -- publica un mensaje real en 'chatbot_requests' ejecutando
# scripts/probar_rabbitmq_local.py DENTRO del contenedor del chatbot ya
# corriendo en el VPS (docker exec), asi reusa las credenciales reales
# de RABBITMQ_URL que ya tiene ese contenedor sin que nadie tenga que
# pegarlas en ningun lado. Sirve para validar de punta a punta el pool
# de workers de techo360-workers: si un worker de prioridad alta esta
# conectado, la respuesta la genera su Ollama, no el del VPS.
on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje de prueba a enviar al chatbot"
        required: false
        default: "Que es el Score de Privacion?"

jobs:
  test-rpc:
    runs-on: self-hosted
    steps:
      - name: Publicar mensaje de prueba y esperar respuesta RPC
        run: |
          docker exec techo360-chatbot python scripts/probar_rabbitmq_local.py "${{ inputs.mensaje }}"
